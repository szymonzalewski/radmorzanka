<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="../styles/mainPage.css" />
  </head>
  <body>
    <nav>
      <h2>Radmorzanka</h2>
      <ul class="ulist">
        <li><a style="color: crimson" href="">TU BĘDZIE KOSZYK</a></li>
        <li><a href="../products/products.html">Produkty</a></li>
        <li><a href="../register/register.html">Rejestracja</a></li>
        <li><a href="../login/login.html">Logowanie</a></li>
      </ul>
    </nav>
    <main>
      <header>
        <h1>Witaj Administratorze</h1>
      </header>
      <section>
        <button id="getOrdersBtn">Pobierz zamównienia</button>
        <ul id="ordersAdminList"></ul>
      </section>
      <section>
        <input
          type="text"
          id="orderStatusEdit"
          placeholder="STATUS (capital letters)"
        />
        <input type="number" id="orderIdStatus" placeholder="Id zamówienia" />
        <button id="editOrderStatus">Edytuj status zamówienia</button>
      </section>
      <section>
        <input
          id="deleteOrderId"
          type="number"
          placeholder="Usuń zamówienie"
        /><button id="deleteOrder">Usuń zamównienie</button>
      </section>
      <section>
        <button id="getUsers">Pobierz użytkowników</button>
        <ul id="usersList"></ul>
      </section>

      <section>
        <button id="getProductsAdmin">Pobierz listę produktów</button>
        <ul id="showProductsAdmin"></ul>
      </section>
      <section>
        <button id="addProduct">Dodaj produkt</button>
        <input
          type="text"
          placeholder="Podaj nazwę produktu"
          id="addProductName"
        />

        <input
          type="number"
          placeholder="Ilość produktów"
          id="addProductQuantity"
        />
        <input type="number" placeholder="Cena produktu" id="addProductPrice" />
      </section>
      <section>
        <button id="editProduct">Aktualizuj product</button>
        <input
          type="mumber"
          placeholder="Podaj numer produktu"
          id="productId"
        />
        <input type="text" placeholder="Nazwa Produktu" id="productName" />
        <input
          type="number"
          placeholder="Ilość produktów"
          id="productQuantity"
        />
        <input type="number" placeholder="Cena produktu" id="productPrice" />
      </section>
      <section>
        <input
          type="mumber"
          placeholder="Podaj numer produktu"
          id="deleteProductId"
        />
        <button id="deleteProduct">Usuń produkt</button>
      </section>
    </main>
    <footer class="footer">
      <section class="footerAddress">
        <ul>
          <li>Ul. Żurawia 3/28,</li>

        </ul>
      </section>
      <section class="footerCopyRight">
        <ul>
          <li>Wszelkie prawa zastrzeżone</li>

        </ul>
      </section>
      <section class="footerAuthor">
        <ul>
          <li>Web creator</li>
          <li>Szymon "timazali" Zalewski</li>
        </ul>
      </section>
    </footer>
    <script src="./admin.js" defer></script>
  </body>
</html>
